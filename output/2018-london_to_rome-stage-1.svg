<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1200">
  <style>
    .line {
      fill: none;
      stroke-width: 4;
      stroke: #C61016;
      stroke-opacity: 0.8;
      stroke-linejoin: round;
      stroke-dasharray: 6 6;
      stroke-linecap: round;
    }
  </style>
  <style>
    .flying {
      stroke-dasharray: 2 8;
    }
  </style>
  <style>
    .stage {
      r: 5;
      fill: #C61016;
    }
  </style>
  <style>
    .home {
      fill: #C61016;
    }
  </style>
  <style>
    .partialAttendance {
      opacity: 0.5;
    }
  </style>
  <style>
    .dayStop {
      r: 3.75;
