      font-family: Helvetica;
      font-size: 18px;
      fill: #C61016;
    }
  </style>
  <style>
    .labelRect {
      display: none;
    }
  </style>
  <defs>
    <mask>
      <rect width="1200" height="1200" x="0" y="0" fill="white"></rect>
      <circle r="5" cx="600" cy="600" fill="black"></circle>
    </mask>
  </defs>
  <circle r="5" cx="600" cy="600" class="stage"></circle>
  <rect width="60.48" height="21.6" x="533.863" y="605.657" opacity="0.2" fill="green" class="labelRect"></rect><text x="533.863" y="622.758" class="label">
    <tspan dy="0" x="533.863">London</tspan>
  </text>
