name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build root project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web project
        working-directory: web
        run: npm run build

      - name: Run web tests
        working-directory: web
        run: npm test
